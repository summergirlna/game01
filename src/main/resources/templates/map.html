<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>探索</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/gamepad-navigation.js}"></script>
</head>
<body>
<main class="game-page">
    <section class="game-card">
        <header class="game-header">
            <div>
                <p class="caption">FIELD MAP</p>
                <h1 th:text="${player.currentArea.displayName}">草原</h1>
            </div>
            <div class="level">
                Lv. <span th:text="${player.level.value}">1</span>
            </div>
        </header>

        <section>
            <p class="caption">WORLD MAP</p>
            <p class="map-mode" th:if="${mapMode.name() == 'WORLD'}">現在操作中</p>
            <section class="map-grid world-map-grid">
                <th:block th:each="row : ${worldRows}">
                    <div class="map-cell"
                         th:classappend="' ' + ${cell.cssClass}"
                         th:each="cell : ${row}"
                         th:text="${cell.symbol}">
                        .
                    </div>
                </th:block>
            </section>
        </section>

        <section>
            <p class="caption">FIELD MAP</p>
            <p class="map-mode" th:if="${mapMode.name() == 'FIELD'}">現在操作中</p>
            <section class="map-grid">
                <th:block th:each="row : ${rows}">
                    <div class="map-cell"
                         th:classappend="' ' + ${cell.cssClass}"
                         th:each="cell : ${row}"
                         th:text="${cell.symbol}">
                        .
                    </div>
                </th:block>
            </section>
        </section>

        <section class="map-controls">
            <div></div>
            <form method="post" th:action="@{/map/move}">
                <input name="command" type="hidden" value="UP">
                <button class="menu-button" data-map-command="UP" type="submit">↑</button>
            </form>
            <div></div>

            <form method="post" th:action="@{/map/move}">
                <input name="command" type="hidden" value="LEFT">
                <button class="menu-button" data-map-command="LEFT" type="submit">←</button>
            </form>

            <form method="post" th:action="@{/map/move}">
                <input name="command" type="hidden" value="ACTION">
                <button class="menu-button" data-map-action data-nav-item type="submit">調べる</button>
            </form>

            <form method="post" th:action="@{/map/move}">
                <input name="command" type="hidden" value="RIGHT">
                <button class="menu-button" data-map-command="RIGHT" type="submit">→</button>
            </form>

            <div></div>
            <form method="post" th:action="@{/map/move}">
                <input name="command" type="hidden" value="DOWN">
                <button class="menu-button" data-map-command="DOWN" type="submit">↓</button>
            </form>
            <div></div>
        </section>

        <a class="visually-hidden" data-nav-back th:href="@{/game}">メニュー</a>

        <p class="message-box" th:text="${message}">
            探索を開始した。
        </p>

        <p class="map-help">
            P: 現在地 / 出: 出口 / 宿: 宿屋 / 道: 道具屋 / 武: 武器屋 / 記: セーブ / T: 世界マップへ戻る道 / N: 世界マップへ続く道 / R: 世界マップへ戻る道 / B: ボス
            / C: 宝箱
        </p>
    </section>
</main>
</body>
</html>
