<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ステータス</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/gamepad-navigation.js}"></script>
</head>
<body>
<main class="status-page">
    <section class="status-card">
        <header class="status-header">
            <div>
                <p class="caption">RPG STATUS</p>
                <h1 th:text="${status.name}">勇者</h1>
            </div>
            <div class="level">
                Lv. <span th:text="${status.level}">1</span>
            </div>
        </header>

        <section class="hp-section">
            <div class="hp-label">
                <span>HP</span>
                <span>
                    <span th:text="${status.hp}">30</span>
                    /
                    <span th:text="${status.maxHp}">30</span>
                </span>
            </div>
            <div class="hp-bar">
                <div class="hp-bar-value"
                     th:style="'width: ' + (${status.hp} * 100 / ${status.maxHp}) + '%'"></div>
            </div>
        </section>

        <section class="status-list">
            <div class="status-row">
                <span>現在地</span>
                <strong th:text="${status.area}">町</strong>
            </div>
            <div class="status-row">
                <span>攻撃力</span>
                <strong th:text="${status.attack}">8</strong>
            </div>
            <div class="status-row">
                <span>武器</span>
                <strong th:text="${status.weapon}">木の剣</strong>
            </div>
            <div class="status-row">
                <span>銅の剣</span>
                <strong th:text="${status.hasCopperSword ? 'あり' : 'なし'}">なし</strong>
            </div>
            <div class="status-row">
                <span>経験値</span>
                <strong th:text="${status.exp}">0</strong>
            </div>
            <div class="status-row">
                <span>ゴールド</span>
                <strong>
                    <span th:text="${status.gold}">0</span> G
                </strong>
            </div>
            <div class="status-row">
                <span>薬草</span>
                <strong>
                    <span th:text="${status.herbAmount}">3</span> 個
                </strong>
            </div>
        </section>

        <a class="menu-button back-button" data-nav-back data-nav-item th:href="@{/game}">メニューに戻る</a>
    </section>
</main>
</body>
</html>
