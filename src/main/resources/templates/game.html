<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RPG</title>
    <link rel="stylesheet" th:href="@{/css/game.css}">
</head>
<body>
<main class="game-page">
    <section class="game-card">
        <header class="game-header">
            <div>
                <p class="caption">WEB RPG</p>
                <h1>RPG</h1>
            </div>
            <div class="level">
                Lv. <span th:text="${player.level.value}">1</span>
            </div>
        </header>

        <section class="hero-summary">
            <div>
                <span class="summary-label">名前</span>
                <strong th:text="${player.name}">勇者</strong>
            </div>
            <div>
                <span class="summary-label">現在地</span>
                <strong th:text="${player.currentArea.displayName}">町</strong>
            </div>
            <div>
                <span class="summary-label">HP</span>
                <strong>
                    <span th:text="${player.hp}">30</span>
                    /
                    <span th:text="${player.maxHp}">30</span>
                </strong>
            </div>
            <div>
                <span class="summary-label">攻撃力</span>
                <strong th:text="${player.attack}">8</strong>
            </div>
            <div>
                <span class="summary-label">武器</span>
                <strong th:text="${player.equipment.weapon.displayName}">木の剣</strong>
            </div>
            <div>
                <span class="summary-label">銅の剣</span>
                <strong th:text="${player.equipment.inventory.hasWeapon(T(com.example.rpg.equipment.WeaponType).COPPER_SWORD) ? 'あり' : 'なし'}">なし</strong>
            </div>
            <div>
                <span class="summary-label">ゴールド</span>
                <strong>
                    <span th:text="${player.gold}">0</span> G
                </strong>
            </div>
            <div>
                <span class="summary-label">薬草</span>
                <strong>
                    <span th:text="${player.inventory.getAmount(T(com.example.rpg.item.ItemType).HERB)}">3</span> 個
                </strong>
            </div>
        </section>

        <section class="menu-panel">
            <form th:unless="${isTown}" method="post" action="#">
                <button class="menu-button" type="button" disabled>探索する</button>
            </form>

            <a class="menu-button" th:href="@{/status}">ステータスを見る</a>

            <form th:if="${isTown}" method="post" th:action="@{/game/inn}">
                <button class="menu-button" type="submit">宿屋に泊まる</button>
            </form>

            <form method="post" th:action="@{/game/use-herb}">
                <button class="menu-button" type="submit">薬草を使う</button>
            </form>

            <form method="post" th:action="@{/game/equip-copper-sword}">
                <button class="menu-button" type="submit">銅の剣を装備する</button>
            </form>

            <form th:if="${isTown}" method="post" th:action="@{/game/buy-herb}">
                <button class="menu-button" type="submit">道具屋で薬草を買う</button>
            </form>

            <form th:if="${isTown}" method="post" th:action="@{/game/buy-copper-sword}">
                <button class="menu-button" type="submit">武器屋で銅の剣を買う</button>
            </form>

            <form method="post" th:action="@{/game/move}">
                <button class="menu-button" type="submit">移動する</button>
            </form>

            <form method="post" th:action="@{/game/save}">
                <button class="menu-button" type="submit">セーブする</button>
            </form>

            <form method="post" th:action="@{/game/load}">
                <button class="menu-button" type="submit">ロードする</button>
            </form>
        </section>

        <p class="message-box" th:text="${message} ?: 'コマンドを選んでください。'">
            コマンドを選んでください。
        </p>
    </section>
</main>
</body>
</html>
