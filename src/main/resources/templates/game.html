<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RPG</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/gamepad-navigation.js}"></script>
</head>
<body>
<main class="game-page">
    <section class="game-card">
        <header class="game-header">
            <div>
                <p class="caption">WEB RPG</p>
                <h1>RPG</h1>
            </div>
            <div class="level">
                Lv. <span th:text="${player.level.value}">1</span>
            </div>
        </header>

        <section class="hero-summary">
            <div>
                <span class="summary-label">名前</span>
                <strong th:text="${player.name}">勇者</strong>
            </div>
            <div>
                <span class="summary-label">現在地</span>
                <strong th:text="${player.currentArea.displayName}">町</strong>
            </div>
            <div>
                <span class="summary-label">HP</span>
                <strong>
                    <span th:text="${player.hp}">30</span>
                    /
                    <span th:text="${player.maxHp}">30</span>
                </strong>
            </div>
            <div>
                <span class="summary-label">攻撃力</span>
                <strong th:text="${player.attack}">8</strong>
            </div>
            <div>
                <span class="summary-label">武器</span>
                <strong th:text="${player.equipment.weapon.displayName}">木の剣</strong>
            </div>
            <div>
                <span class="summary-label">銅の剣</span>
                <strong th:text="${player.equipment.inventory.hasWeapon(T(com.example.rpg.equipment.WeaponType).COPPER_SWORD) ? 'あり' : 'なし'}">なし</strong>
            </div>
            <div>
                <span class="summary-label">ゴールド</span>
                <strong>
                    <span th:text="${player.gold}">0</span> G
                </strong>
            </div>
            <div>
                <span class="summary-label">薬草</span>
                <strong>
                    <span th:text="${player.inventory.getAmount(T(com.example.rpg.item.ItemType).HERB)}">3</span> 個
                </strong>
            </div>
        </section>

        <section class="menu-panel">
            <a class="menu-button" data-nav-back data-nav-item th:href="@{/map}">マップに戻る</a>

            <a class="menu-button" data-nav-item th:href="@{/status}">ステータスを見る</a>

            <form method="post" th:action="@{/game/use-herb}">
                <button class="menu-button" data-nav-item type="submit">薬草を使う</button>
            </form>

            <form method="post" th:action="@{/game/equip-copper-sword}">
                <button class="menu-button" data-nav-item type="submit">銅の剣を装備する</button>
            </form>

        </section>

        <p class="message-box" th:text="${message} ?: 'コマンドを選んでください。'">
            コマンドを選んでください。
        </p>
    </section>
</main>
</body>
</html>
