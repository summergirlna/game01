<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GAME CLEAR</title>
    <link rel="stylesheet" th:href="@{/css/game.css}">
    <script defer th:src="@{/js/gamepad-navigation.js}"></script>
</head>
<body>
<main class="game-page">
    <section class="game-card clear-card">
        <header class="game-header">
            <div>
                <p class="caption">GAME CLEAR</p>
                <h1>世界に平和が戻った</h1>
            </div>
            <div class="level">
                CLEAR
            </div>
        </header>

        <p class="message-box" th:text="${message}">
            ボスを倒した！
        </p>

        <section class="hero-summary">
            <div>
                <span class="summary-label">勇者</span>
                <strong th:text="${player.name}">勇者</strong>
            </div>
            <div>
                <span class="summary-label">レベル</span>
                <strong th:text="${player.level.value}">1</strong>
            </div>
            <div>
                <span class="summary-label">HP</span>
                <strong>
                    <span th:text="${player.hp}">30</span>
                    /
                    <span th:text="${player.maxHp}">30</span>
                </strong>
            </div>
            <div>
                <span class="summary-label">ゴールド</span>
                <strong>
                    <span th:text="${player.gold}">0</span> G
                </strong>
            </div>
        </section>

        <section class="menu-panel">
            <a class="menu-button" data-nav-back data-nav-item th:href="@{/game}">メニューへ戻る</a>
        </section>
    </section>
</main>
</body>
</html>
